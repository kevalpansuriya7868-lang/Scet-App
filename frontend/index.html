<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCET Lab Component &amp; Issue Tracking System</title>
  <meta name="description"
    content="SCET Lab — inventory, issue &amp; return ledger, fines and gate passes for every department lab.">
  <link rel="icon" href="assets/logo-footer.png">
  <link rel="apple-touch-icon" href="assets/logo-footer.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F766E">
  <link rel="stylesheet" href="css/styles.css?v=20261003_07">
</head>

<body>
  <!-- ══ SPLASH SCREEN ═════════════════════════════════════════ -->
  <div id="splash">
    <!-- Burst rings -->
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>

    <!-- Floating particles -->
    <div class="splash-particle" style="width:6px;height:6px;left:15%;bottom:20%;--drift:40px;--dur:5s;--delay:0.1s;">
    </div>
    <div class="splash-particle" style="width:4px;height:4px;left:25%;bottom:35%;--drift:-30px;--dur:7s;--delay:0.5s;">
    </div>
    <div class="splash-particle" style="width:8px;height:8px;left:75%;bottom:15%;--drift:-50px;--dur:6s;--delay:1s;">
    </div>
    <div class="splash-particle" style="width:5px;height:5px;left:80%;bottom:40%;--drift:30px;--dur:9s;--delay:0.3s;">
    </div>
    <div class="splash-particle"
      style="width:3px;height:3px;left:55%;bottom:10%;--drift:-20px;--dur:5.5s;--delay:0.8s;"></div>
    <div class="splash-particle" style="width:7px;height:7px;left:40%;bottom:25%;--drift:60px;--dur:8s;--delay:0.2s;">
    </div>

    <div class="splash-content">
      <div class="splash-logos">
        <img src="assets/sesuni.png" class="splash-logo" alt="SCET University">
        <img src="assets/logo-footer.png" class="splash-logo" alt="SCET Lab">
      </div>
      <div class="splash-title">SCET Lab Portal</div>
      <div class="splash-sub">Sarvajanik College of Engineering &amp; Technology</div>
      <div class="splash-bar-wrap">
        <div class="splash-bar"></div>
      </div>
      <div class="splash-spin"></div>
    </div>
  </div>

  <!-- ══ APP ════════════════════════════════════════════════════ -->
  <div id="app" style="display:none;"></div>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="js/main.js?v=20261003_07"></script>
</body>

</html>
